<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aktiekompas CMS — Admin</title>
<link rel="icon" href="data:," />
<style>
  /* Custom theming to match Aktiekompas brand */
  :root {
    --ak-bg: #0c0c0b;
    --ak-bg-2: #131312;
    --ak-bg-3: #1a1a18;
    --ak-line: rgba(245,241,234,0.08);
    --ak-line-2: rgba(245,241,234,0.16);
    --ak-ink: #f5f1ea;
    --ak-ink-mute: #8a8680;
    --ak-gold: #e0bf65;
    --ak-bull: #4ade80;
    --ak-bear: #f87171;
  }
  body {
    background: var(--ak-bg) !important;
  }
  /* Override Decap default colors with our brand */
  .nc-rootContainer {
    background: var(--ak-bg) !important;
  }
</style>
</head>
<body>
<!-- Decap CMS will mount here -->
<script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
<script>
  // Use a custom preview to render analyses with our actual design
  CMS.registerPreviewStyle('/assets/style.css');

  // Optional: custom preview template (kan udvides senere)
  const AnalysePreview = ({ entry, widgetFor }) => {
    const title = entry.getIn(['data', 'titel']);
    const lede = entry.getIn(['data', 'lede']);
    const setup = entry.getIn(['data', 'setup_type']);
    const kurs = entry.getIn(['data', 'niveauer', 'kurs']);
    const maal = entry.getIn(['data', 'niveauer', 'maal']);
    const stop = entry.getIn(['data', 'niveauer', 'stop']);
    const rr = entry.getIn(['data', 'niveauer', 'rr']);
    const body = widgetFor('body');

    return h('div', { className: 'ana-body', style: { padding: '40px', maxWidth: '720px', margin: '0 auto', color: '#f5f1ea', background: '#0c0c0b', fontFamily: 'Geist, sans-serif' } },
      h('div', { style: { marginBottom: '20px' } },
        h('span', { style: { display: 'inline-block', padding: '5px 10px', borderRadius: '999px', border: '1px solid rgba(74,222,128,0.3)', background: 'rgba(74,222,128,0.08)', color: '#4ade80', fontFamily: 'JetBrains Mono, monospace', fontSize: '10px', letterSpacing: '0.1em', textTransform: 'uppercase' } }, '● ' + (setup || 'Setup'))
      ),
      h('h1', { style: { fontFamily: 'Instrument Serif, serif', fontSize: '52px', lineHeight: '1.05', margin: '0 0 20px', fontWeight: '400' } }, title || '(Ingen titel)'),
      h('p', { style: { fontSize: '17px', color: '#8a8680', lineHeight: '1.65', marginBottom: '30px' } }, lede || ''),
      (kurs || maal || stop) && h('div', { style: { background: '#131312', border: '1px solid rgba(245,241,234,0.08)', borderRadius: '16px', padding: '24px', margin: '32px 0' } },
        h('h4', { style: { fontFamily: 'JetBrains Mono, monospace', fontSize: '11px', letterSpacing: '0.15em', textTransform: 'uppercase', color: '#8a8680', marginBottom: '18px' } }, 'Nøgleniveauer'),
        h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '18px' } },
          h('div', null, h('div', { style: { fontFamily: 'JetBrains Mono, monospace', fontSize: '10px', color: '#8a8680', textTransform: 'uppercase', marginBottom: '6px' } }, 'Kurs'), h('div', { style: { fontFamily: 'Instrument Serif, serif', fontSize: '24px' } }, kurs || '—')),
          h('div', null, h('div', { style: { fontFamily: 'JetBrains Mono, monospace', fontSize: '10px', color: '#8a8680', textTransform: 'uppercase', marginBottom: '6px' } }, 'Mål'), h('div', { style: { fontFamily: 'Instrument Serif, serif', fontSize: '24px', color: '#4ade80' } }, maal || '—')),
          h('div', null, h('div', { style: { fontFamily: 'JetBrains Mono, monospace', fontSize: '10px', color: '#8a8680', textTransform: 'uppercase', marginBottom: '6px' } }, 'Stop'), h('div', { style: { fontFamily: 'Instrument Serif, serif', fontSize: '24px', color: '#f87171' } }, stop || '—')),
          h('div', null, h('div', { style: { fontFamily: 'JetBrains Mono, monospace', fontSize: '10px', color: '#8a8680', textTransform: 'uppercase', marginBottom: '6px' } }, 'R/R'), h('div', { style: { fontFamily: 'Instrument Serif, serif', fontSize: '24px', color: '#e0bf65' } }, rr || '—'))
        )
      ),
      h('div', { style: { lineHeight: '1.75', fontSize: '16.5px' } }, body)
    );
  };

  const h = window.h || ((tag, props, ...children) => React.createElement(tag, props, ...children));

  if (typeof CMS !== 'undefined') {
    CMS.registerPreviewTemplate('analyser', AnalysePreview);
  }
</script>
</body>
</html>
